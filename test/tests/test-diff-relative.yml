name: Test diff_relative input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          diff_relative: "true"
          path: "."
          files: |
            **/*

      - name: Assert action ran successfully with diff_relative
        env:
          ALL_CHANGED: ${{ steps.action.outputs.all_changed_and_modified_files }}
        run: |
          echo "all_changed_and_modified_files: $ALL_CHANGED"
          echo "PASS: action completed with diff_relative input"
