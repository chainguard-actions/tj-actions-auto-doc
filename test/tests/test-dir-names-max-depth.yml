name: Test dir_names_max_depth input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          dir_names: "true"
          dir_names_max_depth: "2"

      - name: Assert action completed with dir_names_max_depth input
        env:
          ALL_CHANGED: ${{ steps.action.outputs.all_changed_files }}
          ALL_MODIFIED: ${{ steps.action.outputs.all_modified_files }}
        run: |
          echo "all_changed_files: $ALL_CHANGED"
          echo "all_modified_files: $ALL_MODIFIED"
          echo "PASS: action completed with dir_names and dir_names_max_depth inputs"
