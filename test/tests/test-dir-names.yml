name: Test directory names output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          dir_names: "true"
          since_last_remote_commit: "false"
      - name: Assert action completed with dir_names mode
        run: |
          echo "Action completed with dir_names=true"
          echo "all_changed_files: ${{ steps.action.outputs.all_changed_files }}"
          echo "PASS: action ran with dir_names=true without error"
