name: Test dir names mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dir_names: "true"
          dir_names_max_depth: "2"
          since_last_remote_commit: "false"
      - name: Assert action completed with dir_names mode
        run: |
          echo "Action completed with dir_names=true and dir_names_max_depth=2"
          echo "PASS"
