name: Update release version.
on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    name: semver-diff
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@6c999acf206f5561e19f46301bb310e9e70d8815 # v7

      - name: Run semver-diff
        id: semver-diff
        uses: tj-actions/semver-diff@e18ea2e8548c7c5b082ebe123ecc5001cd7ce940 # v2

      - name: Show release type
        if: steps.semver-diff.outputs.release_type == 'major'
        env:
          OLD_VERSION_RAW: ${{ steps.semver-diff.outputs.old_version }}
          NEW_VERSION_RAW: ${{ steps.semver-diff.outputs.new_version }}
        run: |
          OLD_VERSION=$(echo "$OLD_VERSION_RAW" | cut -d'.' -f1 | cut -d'v' -f2)
          MAJOR_VERSION=$(echo "$NEW_VERSION_RAW" | cut -d'.' -f1 | cut -d'v' -f2)
          
          make upgrade-from-one-version-to-a-major-version OLD_VERSION="$OLD_VERSION" MAJOR_VERSION="$MAJOR_VERSION"

      - name: Commit the change to the main branch and update the latest version
        if: steps.semver-diff.outputs.release_type == 'major'
        env:
          TAG: ${{ steps.branch-name.outputs.tag }}
          OLD_VERSION: ${{ steps.semver-diff.outputs.old_version }}
          NEW_VERSION: ${{ steps.semver-diff.outputs.new_version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -d "$TAG"
          git add .
          git commit -m "chore: upgraded from $OLD_VERSION -> $NEW_VERSION"
          git push -f origin main
          git tag "$TAG"
          git push -f origin "$TAG"

  release:
    name: release
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version-file: 'go.mod'

      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@5742e2a039330cbb23ebf35f046f814d4c6ff811 # v5
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

  update-version:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync release version.
        uses: tj-actions/sync-release-version@2a7ef0deb39b3ecce887ee99d2261c6cef989d84 # v13
        id: sync-release-version
        with:
          pattern: '${{ github.repository }}@'
          only_major: true
          paths: |
            README.md

      - name: Sync release version for action.yml.
        uses: tj-actions/sync-release-version@2a7ef0deb39b3ecce887ee99d2261c6cef989d84 # v13
        id: sync-release-version-action
        with:
          pattern: 'version: '
          paths: |
            action.yml

      - name: Run git-cliff
        uses: tj-actions/git-cliff@75599f745633e29f99bd9e14a30865b7d2fcbe84 # v1

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@6c999acf206f5561e19f46301bb310e9e70d8815 # v7

      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@54e20d3c522fbeed99ebaf2e38a1eb33214c58ba # v16
        id: verify-changed-files
        with:
          files: |
            README.md
            HISTORY.md
            action.yml

      - name: Commit changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          TAG: ${{ steps.branch-name.outputs.tag }}
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
          OLD_VERSION: ${{ steps.sync-release-version.outputs.old_version }}
          NEW_VERSION: ${{ steps.sync-release-version.outputs.new_version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -d "$TAG"
          git add "$CHANGED_FILES"
          git commit -m "chore: upgraded from $OLD_VERSION -> $NEW_VERSION"
          git tag "$TAG"
          git push -f origin "$TAG"

      - name: Run release-tagger
        uses: tj-actions/release-tagger@1a9264b0fd99a1ef92c4fd2f077f292900cc79b6 # v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@153407881ec5c347639a548ade7d8ad1d6740e38 # v5.0.2
        with:
          base: "main"
          labels: "merge when passing"
          title: "Upgraded to ${{ steps.sync-release-version.outputs.new_version }}"
          branch: "upgrade-to-${{ steps.sync-release-version.outputs.new_version }}"
          commit-message: "Upgraded from ${{ steps.sync-release-version.outputs.old_version }} -> ${{ steps.sync-release-version.outputs.new_version }}"
          body: "View [CHANGES](https://github.com/${{ github.repository }}/compare/${{ steps.sync-release-version.outputs.old_version }}...${{ steps.sync-release-version.outputs.new_version }})"
          token: ${{ secrets.PAT_TOKEN }}
