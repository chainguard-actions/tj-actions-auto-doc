name: Test missing file - graceful warning exit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When the input file does not exist, the action should exit 0 with a warning
      - id: action
        uses: .
        with:
          filename: /tmp/nonexistent-file-that-does-not-exist.yml
          output: /tmp/README-missing-test.md

      - name: Assert action completed without failure
        run: |
          echo "PASS: action completed successfully (exit 0) when file is missing"
