name: Test missing file - action warns and exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Confirm the fixture file does not exist
        run: |
          if [ -f "$GITHUB_WORKSPACE/tests/fixtures/nonexistent-action.yml" ]; then
            echo "FAIL: file should not exist"
            exit 1
          fi
          echo "Confirmed: nonexistent-action.yml does not exist"

      - id: action
        uses: .
        with:
          filename: tests/fixtures/nonexistent-action.yml
          output: tests/fixtures/nonexistent-README.md
          bin_path: /nonexistent/path/to/auto-doc
          markdown_links: 'false'
          repository: tj-actions/auto-doc

      - name: Assert action succeeded (missing file is a warning, not an error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 for missing file (warning only)"
          else
            echo "FAIL: expected success (exit 0) for missing file, got '$OUTCOME'"
            exit 1
          fi
