name: Test bin_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Download the auto-doc binary manually so we can pass it via bin_path
      - name: Download auto-doc binary
        run: |
          mkdir -p /tmp/auto-doc-bin
          # Download the auto-doc binary for linux amd64
          curl -sSfL \
            "https://github.com/tj-actions/auto-doc/releases/download/v3.6.0/auto-doc_Linux_x86_64.tar.gz" \
            -o /tmp/auto-doc-bin/auto-doc.tar.gz
          tar -xzf /tmp/auto-doc-bin/auto-doc.tar.gz -C /tmp/auto-doc-bin
          chmod +x /tmp/auto-doc-bin/auto-doc
          echo "Binary downloaded: $(/tmp/auto-doc-bin/auto-doc --version || true)"

      # Create a minimal action.yml fixture and a README with the required markers
      - name: Setup fixture files
        run: |
          mkdir -p /tmp/auto-doc-binpath-test
          cat > /tmp/auto-doc-binpath-test/action.yml << 'EOF'
          name: binpath-test-action
          description: A test action for bin_path input
          inputs:
            custom-input:
              description: 'A custom test input'
              required: false
              default: 'world'
          outputs:
            custom-output:
              description: 'A custom test output'
          runs:
            using: composite
            steps:
              - run: echo "hello"
                shell: bash
          EOF

          cat > /tmp/auto-doc-binpath-test/README.md << 'EOF'
          # Bin Path Test Action

          <!-- AUTO-DOC-INPUT:START - Do not remove or modify this section -->
          <!-- AUTO-DOC-INPUT:END -->

          <!-- AUTO-DOC-OUTPUT:START - Do not remove or modify this section -->
          <!-- AUTO-DOC-OUTPUT:END -->
          EOF

      - id: action
        uses: .
        with:
          filename: /tmp/auto-doc-binpath-test/action.yml
          output: /tmp/auto-doc-binpath-test/README.md
          bin_path: /tmp/auto-doc-bin/auto-doc
          markdown_links: 'false'

      - name: Assert README was updated with input documentation
        run: |
          echo "=== README content ==="
          cat /tmp/auto-doc-binpath-test/README.md
          echo "=== End README ==="
          if ! grep -q "custom-input" /tmp/auto-doc-binpath-test/README.md; then
            echo "FAIL: expected 'custom-input' to appear in README.md"
            exit 1
          fi
          echo "PASS: README contains input documentation when bin_path is specified"

      - name: Assert README contains output documentation
        run: |
          if ! grep -q "custom-output" /tmp/auto-doc-binpath-test/README.md; then
            echo "FAIL: expected 'custom-output' to appear in README.md"
            exit 1
          fi
          echo "PASS: README contains output documentation when bin_path is specified"
