name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run auto-doc with basic inputs
        id: action
        uses: .
        with:
          filename: ${{ github.workspace }}/actions/hardened/tj-actions--auto-doc/v3.4.0/tests/fixtures/sample-action.yml
          output: /tmp/README-basic.md
          col_max_width: '1000'
          col_max_words: '5'
          markdown_links: 'true'
          bin_path: ${{ github.workspace }}/actions/hardened/tj-actions--auto-doc/v3.4.0/tests/fixtures/mock-auto-doc
      - name: Assert action completed successfully
        run: |
          echo "Action completed successfully"
          echo "PASS"
