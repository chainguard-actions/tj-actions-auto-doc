name: Test input_columns and output_columns filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal action.yml and README for column filtering test
        run: |
          mkdir -p /tmp/columns-test
          cat > /tmp/columns-test/action.yml <<'EOF'
          name: columns-test-action
          description: Testing column filtering
          inputs:
            my-input:
              description: 'A test input'
              required: true
              default: 'hello'
            another-input:
              description: 'Another test input'
              required: false
          outputs:
            my-output:
              description: 'A test output'
          runs:
            using: composite
            steps:
              - run: echo "hello"
                shell: bash
          EOF
          cat > /tmp/columns-test/README.md <<'EOF'
          # Columns Test Action

          <!-- AUTO-DOC-INPUT:START - Do not remove or modify this section -->
          <!-- AUTO-DOC-INPUT:END -->

          <!-- AUTO-DOC-OUTPUT:START - Do not remove or modify this section -->
          <!-- AUTO-DOC-OUTPUT:END -->
          EOF

      - id: autodoc
        uses: .
        with:
          filename: /tmp/columns-test/action.yml
          output: /tmp/columns-test/README.md
          markdown_links: 'false'
          input_columns: |
            Input
            Description
            Required
          output_columns: |
            Output
            Description

      - name: Assert README.md was updated with input documentation
        run: |
          echo "=== README.md contents ==="
          cat /tmp/columns-test/README.md
          if ! grep -q "my-input" /tmp/columns-test/README.md; then
            echo "FAIL: README.md does not contain 'my-input'"
            exit 1
          fi
          echo "PASS: README.md contains input documentation"

      - name: Assert output documentation is present
        run: |
          if ! grep -q "my-output" /tmp/columns-test/README.md; then
            echo "FAIL: README.md does not contain 'my-output'"
            exit 1
          fi
          echo "PASS: README.md contains output documentation"
