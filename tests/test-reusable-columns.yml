name: Test reusable workflow column filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake binary that records args
        run: |
          cat > /tmp/fake-auto-doc-reusable-cols.sh << 'SCRIPT'
          #!/bin/sh
          # Fake auto-doc that records the args it received
          FILENAME="action.yml"
          OUTPUT="README.md"
          ARGS_LOG="/tmp/auto-doc-reusable-cols-args.txt"

          echo "$@" > "$ARGS_LOG"

          for arg in "$@"; do
            case "$arg" in
              --filename=*) FILENAME="${arg#--filename=}" ;;
              --output=*) OUTPUT="${arg#--output=}" ;;
            esac
          done

          cat > "$OUTPUT" << 'EOF'
          <!-- AUTO-DOC-INPUT:START - Do not remove or modify this section -->
          | INPUT | DESCRIPTION |
          |-------|-------------|
          | name | Workflow name |
          <!-- AUTO-DOC-INPUT:END -->
          EOF

          echo "auto-doc: generated reusable workflow documentation from $FILENAME to $OUTPUT"
          exit 0
          SCRIPT
          chmod +x /tmp/fake-auto-doc-reusable-cols.sh

      - name: Create a fake reusable workflow file
        run: |
          cat > /tmp/fake-reusable-cols-workflow.yml << 'EOF'
          on:
            workflow_call:
              inputs:
                name:
                  description: 'Workflow name'
                  required: false
                  type: string
              outputs:
                result:
                  description: 'The result'
              secrets:
                token:
                  description: 'A secret token'
                  required: false
          jobs:
            example:
              runs-on: ubuntu-latest
              steps:
                - run: echo "hello"
          EOF

      - name: Run auto-doc with reusable workflow column filters
        id: action
        uses: .
        with:
          filename: /tmp/fake-reusable-cols-workflow.yml
          output: /tmp/test-reusable-cols.md
          bin_path: /tmp/fake-auto-doc-reusable-cols.sh
          reusable: 'true'
          reusable_input_columns: |
            Input
            Description
          reusable_output_columns: |
            Output
            Description
          reusable_secret_columns: |
            Secret
            Description

      - name: Assert output file was created
        run: |
          if [ ! -f "/tmp/test-reusable-cols.md" ]; then
            echo "FAIL: output file /tmp/test-reusable-cols.md was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert reusable column args were passed to binary
        run: |
          ARGS=$(cat /tmp/auto-doc-reusable-cols-args.txt)
          echo "Args received: $ARGS"

          FAIL=0

          if ! echo "$ARGS" | grep -q "reusableInputColumns"; then
            echo "FAIL: --reusableInputColumns argument was not passed to the binary"
            FAIL=1
          fi

          if ! echo "$ARGS" | grep -q "reusableOutputColumns"; then
            echo "FAIL: --reusableOutputColumns argument was not passed to the binary"
            FAIL=1
          fi

          if ! echo "$ARGS" | grep -q "reusableSecretColumns"; then
            echo "FAIL: --reusableSecretColumns argument was not passed to the binary"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi

          echo "PASS: all reusable column arguments were passed to the binary"
