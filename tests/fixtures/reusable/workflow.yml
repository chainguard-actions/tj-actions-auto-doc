name: My Reusable Workflow
on:
  workflow_call:
    inputs:
      environment:
        description: 'The environment to deploy to'
        required: true
        type: string
    secrets:
      deploy-token:
        description: 'Token for deployment'
        required: true
    outputs:
      deploy-url:
        description: 'The deployed URL'
        value: ${{ jobs.deploy.outputs.url }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploying"
        shell: bash
