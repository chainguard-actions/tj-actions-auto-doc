name: Test custom column filtering
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test files
        run: |
          # Copy fixture files to workspace for the action to process
          cp "$GITHUB_WORKSPACE/tests/fixtures/simple-action.yml" "$GITHUB_WORKSPACE/test-action-cols.yml"
          cp "$GITHUB_WORKSPACE/tests/fixtures/README-with-markers.md" "$GITHUB_WORKSPACE/test-README-cols.md"

      - id: autodoc
        name: Run auto-doc with specific input columns
        uses: .
        with:
          filename: test-action-cols.yml
          output: test-README-cols.md
          input_columns: |
            Input
            Description
            Required
          markdown_links: 'false'

      - name: Assert README was updated with filtered columns
        run: |
          echo "=== README content ==="
          cat "$GITHUB_WORKSPACE/test-README-cols.md"
          echo "=== End README ==="

          # Check that the AUTO-DOC-INPUT markers were filled in
          if ! grep -q "AUTO-DOC-INPUT:START" "$GITHUB_WORKSPACE/test-README-cols.md"; then
            echo "FAIL: AUTO-DOC-INPUT:START marker not found"
            exit 1
          fi

          # Check that input names appear in the README
          if ! grep -q "my-input" "$GITHUB_WORKSPACE/test-README-cols.md"; then
            echo "FAIL: 'my-input' not found in README"
            exit 1
          fi

          echo "PASS: README was updated with filtered column documentation"
