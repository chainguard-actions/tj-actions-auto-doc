name: Test reusable workflow mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a reusable-aware fake binary
        run: |
          cat > /tmp/fake-auto-doc-reusable.sh << 'SCRIPT'
          #!/bin/sh
          # Fake auto-doc that records args and checks for --reusable flag
          FILENAME="action.yml"
          OUTPUT="README.md"
          ARGS_LOG="/tmp/auto-doc-reusable-args.txt"

          echo "$@" > "$ARGS_LOG"

          for arg in "$@"; do
            case "$arg" in
              --filename=*) FILENAME="${arg#--filename=}" ;;
              --output=*) OUTPUT="${arg#--output=}" ;;
            esac
          done

          cat > "$OUTPUT" << 'EOF'
          <!-- AUTO-DOC-INPUT:START - Do not remove or modify this section -->
          | INPUT | TYPE | REQUIRED | DEFAULT | DESCRIPTION |
          |-------|------|----------|---------|-------------|
          | name | String | false | | Workflow name |
          <!-- AUTO-DOC-INPUT:END -->
          EOF

          echo "auto-doc: generated reusable workflow documentation from $FILENAME to $OUTPUT"
          exit 0
          SCRIPT
          chmod +x /tmp/fake-auto-doc-reusable.sh

      - name: Create a fake reusable workflow file
        run: |
          cat > /tmp/fake-reusable-workflow.yml << 'EOF'
          on:
            workflow_call:
              inputs:
                name:
                  description: 'Workflow name'
                  required: false
                  type: string
          jobs:
            example:
              runs-on: ubuntu-latest
              steps:
                - run: echo "hello"
          EOF

      - name: Run auto-doc in reusable workflow mode
        id: action
        uses: .
        with:
          filename: /tmp/fake-reusable-workflow.yml
          output: /tmp/test-output-reusable.md
          bin_path: /tmp/fake-auto-doc-reusable.sh
          reusable: 'true'

      - name: Assert output file was created
        run: |
          if [ ! -f "/tmp/test-output-reusable.md" ]; then
            echo "FAIL: output file /tmp/test-output-reusable.md was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert --reusable flag was passed to binary
        run: |
          ARGS=$(cat /tmp/auto-doc-reusable-args.txt)
          echo "Args received: $ARGS"
          if ! echo "$ARGS" | grep -q "\-\-reusable"; then
            echo "FAIL: --reusable argument was not passed to the binary"
            exit 1
          fi
          echo "PASS: --reusable argument was passed to the binary"
