name: Test reusable workflow documentation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a reusable workflow fixture and a README with the required markers
      - name: Setup fixture files
        run: |
          mkdir -p /tmp/auto-doc-reusable-test
          cat > /tmp/auto-doc-reusable-test/reusable.yml << 'EOF'
          name: Reusable workflow example
          on:
            workflow_call:
              inputs:
                config-path:
                  required: true
                  type: string
                  description: "The configuration path"
                username:
                  required: false
                  type: string
                  description: "Username"
                  default: "example"
              outputs:
                firstword:
                  description: "The first output string"
                  value: ${{ jobs.example_job.outputs.output1 }}
              secrets:
                token:
                  required: true
                  description: "Repo scoped PAT token"
          jobs:
            example_job:
              runs-on: ubuntu-latest
              steps:
                - run: echo "hello"
          EOF

          cat > /tmp/auto-doc-reusable-test/README.md << 'EOF'
          # Reusable Workflow

          <!-- AUTO-DOC-INPUT:START - Do not remove or modify this section -->
          <!-- AUTO-DOC-INPUT:END -->

          <!-- AUTO-DOC-OUTPUT:START - Do not remove or modify this section -->
          <!-- AUTO-DOC-OUTPUT:END -->

          <!-- AUTO-DOC-SECRETS:START - Do not remove or modify this section -->
          <!-- AUTO-DOC-SECRETS:END -->
          EOF

      - id: action
        uses: .
        with:
          filename: /tmp/auto-doc-reusable-test/reusable.yml
          output: /tmp/auto-doc-reusable-test/README.md
          reusable: 'true'
          reusable_input_columns: |
            Input
            Description
            Required
          reusable_output_columns: |
            Output
            Description
          reusable_secret_columns: |
            Secret
            Description
            Required
          markdown_links: 'false'

      - name: Assert README was updated with reusable input documentation
        run: |
          echo "=== README content ==="
          cat /tmp/auto-doc-reusable-test/README.md
          echo "=== End README ==="
          if ! grep -q "config-path" /tmp/auto-doc-reusable-test/README.md; then
            echo "FAIL: expected 'config-path' to appear in README.md"
            exit 1
          fi
          echo "PASS: README contains reusable input documentation"

      - name: Assert README contains reusable secret documentation
        run: |
          if ! grep -q "token" /tmp/auto-doc-reusable-test/README.md; then
            echo "FAIL: expected 'token' secret to appear in README.md"
            exit 1
          fi
          echo "PASS: README contains reusable secret documentation"
