name: Test custom output columns filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake binary that records args
        run: |
          cat > /tmp/fake-auto-doc-output-cols.sh << 'SCRIPT'
          #!/bin/sh
          # Fake auto-doc that records the args it received
          FILENAME="action.yml"
          OUTPUT="README.md"
          ARGS_LOG="/tmp/auto-doc-output-cols-args.txt"

          echo "$@" > "$ARGS_LOG"

          for arg in "$@"; do
            case "$arg" in
              --filename=*) FILENAME="${arg#--filename=}" ;;
              --output=*) OUTPUT="${arg#--output=}" ;;
            esac
          done

          cat > "$OUTPUT" << 'EOF'
          <!-- AUTO-DOC-OUTPUT:START - Do not remove or modify this section -->
          | OUTPUT | DESCRIPTION |
          |--------|-------------|
          | result | The result value |
          <!-- AUTO-DOC-OUTPUT:END -->
          EOF

          echo "auto-doc: generated documentation from $FILENAME to $OUTPUT"
          exit 0
          SCRIPT
          chmod +x /tmp/fake-auto-doc-output-cols.sh

      - name: Run auto-doc with custom output columns
        id: action
        uses: .
        with:
          filename: action.yml
          output: /tmp/test-output-cols.md
          bin_path: /tmp/fake-auto-doc-output-cols.sh
          output_columns: |
            Output
            Description

      - name: Assert output file was created
        run: |
          if [ ! -f "/tmp/test-output-cols.md" ]; then
            echo "FAIL: output file /tmp/test-output-cols.md was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert outputColumns args were passed to binary
        run: |
          ARGS=$(cat /tmp/auto-doc-output-cols-args.txt)
          echo "Args received: $ARGS"
          if ! echo "$ARGS" | grep -q "outputColumns"; then
            echo "FAIL: --outputColumns argument was not passed to the binary"
            exit 1
          fi
          echo "PASS: --outputColumns argument was passed to the binary"
