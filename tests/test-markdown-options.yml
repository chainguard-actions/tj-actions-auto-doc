name: Test markdown options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown-options-aware fake binary
        run: |
          cat > /tmp/fake-auto-doc-md.sh << 'SCRIPT'
          #!/bin/sh
          # Fake auto-doc that records args for markdown options testing
          FILENAME="action.yml"
          OUTPUT="README.md"
          ARGS_LOG="/tmp/auto-doc-md-args.txt"

          echo "$@" > "$ARGS_LOG"

          for arg in "$@"; do
            case "$arg" in
              --filename=*) FILENAME="${arg#--filename=}" ;;
              --output=*) OUTPUT="${arg#--output=}" ;;
            esac
          done

          cat > "$OUTPUT" << 'EOF'
          <!-- AUTO-DOC-INPUT:START - Do not remove or modify this section -->
          | INPUT | TYPE | REQUIRED | DEFAULT | DESCRIPTION |
          |-------|------|----------|---------|-------------|
          | [`filename`](https://example.com) | String | false | `"action.yml"` | Path to the yaml file |
          <!-- AUTO-DOC-INPUT:END -->
          EOF

          echo "auto-doc: generated documentation with markdown links from $FILENAME to $OUTPUT"
          exit 0
          SCRIPT
          chmod +x /tmp/fake-auto-doc-md.sh

      - name: Run auto-doc with markdown links and code blocks enabled
        id: action
        uses: .
        with:
          filename: action.yml
          output: /tmp/test-output-md.md
          bin_path: /tmp/fake-auto-doc-md.sh
          markdown_links: 'true'
          use_code_blocks: 'true'

      - name: Assert output file was created
        run: |
          if [ ! -f "/tmp/test-output-md.md" ]; then
            echo "FAIL: output file /tmp/test-output-md.md was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert --markdownLinks flag was passed to binary
        run: |
          ARGS=$(cat /tmp/auto-doc-md-args.txt)
          echo "Args received: $ARGS"
          if ! echo "$ARGS" | grep -q "\-\-markdownLinks"; then
            echo "FAIL: --markdownLinks argument was not passed to the binary"
            exit 1
          fi
          echo "PASS: --markdownLinks argument was passed to the binary"

      - name: Assert --useCodeBlocks flag was passed to binary
        run: |
          ARGS=$(cat /tmp/auto-doc-md-args.txt)
          echo "Args received: $ARGS"
          if ! echo "$ARGS" | grep -q "\-\-useCodeBlocks"; then
            echo "FAIL: --useCodeBlocks argument was not passed to the binary"
            exit 1
          fi
          echo "PASS: --useCodeBlocks argument was passed to the binary"
