name: Test markdown_links flag is passed to binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reset README fixture to initial state
        run: git checkout -- tests/fixtures/markdown-links/README.md

      - id: action
        uses: .
        with:
          filename: tests/fixtures/markdown-links/action.yml
          output: tests/fixtures/markdown-links/README.md
          bin_path: ${{ github.workspace }}/tests/fixtures/markdown-links/fake-auto-doc
          markdown_links: 'true'
          repository: tj-actions/auto-doc

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action succeeded with markdown_links=true"

      - name: Assert README was updated
        run: |
          README="$GITHUB_WORKSPACE/tests/fixtures/markdown-links/README.md"
          echo "README contents:"
          cat "$README"
          if grep -q "AUTO-DOC-INPUT:START" "$README"; then
            echo "PASS: README contains auto-doc markers"
          else
            echo "FAIL: README does not contain auto-doc markers"
            exit 1
          fi
